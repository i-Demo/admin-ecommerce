<div class="w-screen h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
    <div class="max-w-3xl w-full text-center">
        <!-- Blob / gradient bg -->
        <div class="relative mx-auto mb-8 h-40 w-40">
            <div class="absolute inset-0 rounded-full blur-2xl opacity-40 animate-pulse
                        bg-gradient-to-tr from-indigo-500 via-sky-400 to-emerald-400"></div>
            <div class="relative flex h-40 w-40 items-center justify-center rounded-full
                        bg-white dark:bg-gray-800 shadow-xl ring-1 ring-black/5 dark:ring-white/10">
                <span class="text-5xl font-extrabold tracking-tight text-gray-900 dark:text-gray-100">404</span>
            </div>
        </div>

        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-gray-100">
            {{ 'NOT_FOUND' | translate }}
        </h1>
        <p class="mt-3 text-base md:text-lg text-gray-600 dark:text-gray-300">
            {{ 'NOT_FOUND_CONTENT' | translate }}
        </p>

        <!-- Actions -->
        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
            <button pButton (click)="goBack()" [label]="'BACK' | translate" icon="pi pi-arrow-left"
                    class="p-button-outlined"></button>
            <a routerLink="/dashboard" pButton [label]="'GO_TO_DASHBOARD' | translate" icon="pi pi-home"
                class="p-button-outlined"></a>
            <a routerLink="/login" pButton [label]="'LOGIN' | translate" icon="pi pi-user"
                class="p-button-outlined"></a>
        </div>

        <!-- Helpful links -->
        <div class="mt-10 grid grid-cols-1 sm:grid-cols-3 gap-4">
            <a routerLink="/dashboard"
                class="group rounded-2xl p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                        hover:shadow-lg transition">
                <div class="flex items-center gap-3">
                    <i class="pi pi-chart-line text-xl"></i>
                    <div class="text-left">
                        <p class="font-semibold text-gray-900 dark:text-gray-100 group-hover:underline">{{ 'DASHBOARD' | translate}}</p>
                        <p class="text-sm text-gray-500 dark:text-gray-400">{{ 'DATA_OVERVIEW' | translate}}</p>
                    </div>
                </div>
            </a>

            <a routerLink="/product"
                class="group rounded-2xl p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                        hover:shadow-lg transition">
                <div class="flex items-center gap-3">
                    <i class="pi pi-list-check text-xl"></i>
                    <div class="text-left">
                        <p class="font-semibold text-gray-900 dark:text-gray-100 group-hover:underline">{{ 'PRODUCT' | translate}}</p>
                        <p class="text-sm text-gray-500 dark:text-gray-400">{{ 'PRODUCT_MANAGEMENT' | translate}}</p>
                    </div>
                </div>
            </a>

            <a routerLink="/order-management"
                class="group rounded-2xl p-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                        hover:shadow-lg transition">
                <div class="flex items-center gap-3">
                    <i class="pi pi-sliders-h text-xl"></i>
                    <div class="text-left">
                        <p class="font-semibold text-gray-900 dark:text-gray-100 group-hover:underline">{{ 'ORDERS' | translate}}</p>
                        <p class="text-sm text-gray-500 dark:text-gray-400">{{ 'ORDER_MANAGEMENT' | translate}}</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
