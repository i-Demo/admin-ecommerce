<!-- pre-load.component.html -->
@if(show()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-r from-purple-700 via-pink-500 to-indigo-600 bg-opacity-80 backdrop-blur-sm">
        <div class="relative w-24 h-24">
            <div class="absolute top-0 left-0 w-24 h-24 border-4 border-t-transparent border-white rounded-full animate-spin-fast"></div>
            <div class="absolute w-16 h-16 border-4 border-b-transparent border-pink-300 rounded-full animate-spin-slow top-1/4 left-1/4"></div>
            <div class="absolute w-8 h-8 bg-white rounded-full animate-pulse top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        </div>
    </div>
}
