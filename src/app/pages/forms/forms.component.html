<h2 class="text-2xl font-bold mb-4">Reactive Forms</h2>
<div class="card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
        <input pInputText formControlName="name" placeholder="Your name" />
        <input pInputText formControlName="email" placeholder="Email" />
        <button pButton type="submit" label="Submit" [disabled]="form.invalid"></button>
    </form>

    <div class="mt-4 p-2" [appHighlight]="form.valid ? '#dcfce7' : '#fee2e2'">
        Form valid: {{ form.valid }}
    </div>
</div>
