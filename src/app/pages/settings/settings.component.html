<div class="flex h-full bg-gray-100 dark:bg-gray-900">
    <!-- Sidebar -->
    <aside class="w-64 rounded-lg bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-4 min-w-[224px]">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-6">{{ 'SETTINGS' | translate }}</h2>
        <nav class="space-y-2">
            <button class="w-full text-left px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
                    [ngClass]="{ 'bg-gray-200 dark:bg-gray-700 font-semibold': activeTab==='account' }"
                    (click)="activeTab='account'">
                {{ 'ACCOUNT_SECURITY' | translate }}
            </button>
            <button class="w-full text-left px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
                    [ngClass]="{ 'bg-gray-200 dark:bg-gray-700 font-semibold': activeTab==='preferences' }"
                    (click)="activeTab='preferences'">
                {{ 'PRODUCT_PREFERENCES' | translate }}
            </button>
            <button class="w-full text-left px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700"
                    [ngClass]="{ 'bg-gray-200 dark:bg-gray-700 font-semibold': activeTab==='theme' }"
                    (click)="activeTab='theme'">
                {{ 'THEME_LAYOUT' | translate }}
            </button>
        </nav>
    </aside>

    <!-- Content Panel -->
    <div class="flex-1 p-6">
        <!-- Account & Security -->
        <div *ngIf="activeTab==='account'" class="space-y-6">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{ 'ACCOUNT_SECURITY' | translate }}</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 mb-1">{{ 'NEW_PASSWORD' | translate }}</label>
                    <input type="password" [(ngModel)]="newPassword" placeholder="{{ 'NEW_PASSWORD' | translate }}" 
                        class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white"/>
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 mb-1">{{ 'CONFIRM_PASSWORD' | translate }}</label>
                    <input type="password" [(ngModel)]="confirmPassword" placeholder="{{ 'CONFIRM_PASSWORD' | translate }}"
                        class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white"/>
                </div>
            </div>

            <div class="flex justify-end items-center gap-4">
                <button type="button"
                    class="ml-auto px-4 py-2 rounded-md bg-green-600 hover:bg-green-500 text-white
                        disabled:opacity-50 disabled:cursor-not-allowed"
                    [disabled]="!newPassword || !confirmPassword"
                    (click)="updatePassword()">
                    {{ 'SAVE_CHANGES' | translate }}
                </button>
            </div>
            <p-toggleButton [(ngModel)]="twoFAEnabled" 
                [onLabel]="'2FA On'" offLabel="2FA Off" 
                [onIcon]="'pi pi-check'" [offIcon]="'pi pi-times'">
            </p-toggleButton>
        </div>


        <!-- Product Preferences -->
        <div *ngIf="activeTab==='preferences'" class="space-y-6">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{ 'PRODUCT_PREFERENCES' | translate }}</h3>

            <label class="block text-gray-700 dark:text-gray-300 mb-1">
                {{ 'ITEMS_PER_PAGE' | translate }}
            </label>
            <p-select 
                [options]="pageSizeOptions"
                [(ngModel)]="itemsPerPage"
                optionLabel="label"
                optionValue="value"
                [showClear]="false">
            </p-select>

            <label class="block text-gray-700 dark:text-gray-300 mt-4 mb-1">
                {{ 'DEFAULT_SORT_ORDER' | translate }}
            </label>
            <p-select 
                [options]="sortOrderOptions"
                [(ngModel)]="defaultSort"
                optionValue="value"
                [showClear]="false">
                <ng-template let-option pTemplate="item">
                    {{ option.label | translate }}
                </ng-template>
                <ng-template let-option pTemplate="selectedItem">
                    {{ option.label | translate }}
                </ng-template>
            </p-select>

        </div>

        <!-- Theme & Layout -->
        <div *ngIf="activeTab==='theme'" class="space-y-6">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{ 'THEME_LAYOUT' | translate }}</h3>

            <button (click)="toggleTheme()"
                type="button"
                class="flex justify-center items-center gap-2 px-4 py-2 min-w-[100px] bg-gray-200 dark:bg-gray-700 text-gray-800 
                    dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition"
            >
                @if (isLightTheme()) {
                    <i class="pi pi-sun"></i>
                } @else {
                    <i class="pi pi-moon"></i>
                }
                {{ (isLightTheme() ? 'LIGHT' : 'DARK') | translate }}
            </button>
        </div>
    </div>
</div>
